version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres-test-db
    environment:
      POSTGRES_USER: squared
      POSTGRES_PASSWORD: squared
      POSTGRES_DB: squared-test
    ports:
      - "5433:5432"
    volumes:
      - ./data:/var/lib/postgresql/data

volumes:
  postgres_data:
