version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: postgres-test-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-squared}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-squared}
      POSTGRES_DB: ${POSTGRES_DB:-squared-test}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: