name: CI Pipeline

on:
  pull_request:
    branches:
      - develop

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "20.x"

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Lint code
        run: pnpm lint

  types_check:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Type checking
        run: pnpm types:check

  test:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - name: Cache Cypress binary
        uses: actions/cache@v3
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: Install Cypress
        run: npx cypress install

      - name: Run tests
        run: pnpm test:ci
