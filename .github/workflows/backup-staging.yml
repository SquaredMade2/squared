name: squared-staging

on:
  schedule:
    - cron: '0 0 1 * *' #runs first day each month at midnight UTC
  workflow_dispatch:

jobs:
  staging-backup:
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    env:
      S3_BUCKET_NAME: 'squared-staging-backup'
      AWS_REGION: 'us-east-1'
      PG_VERSION: '16'

    steps:
      - uses: actions/checkout@v4
      - name: Setup PostgreSQL
        uses: tj-actions/install-postgresql@v3
        with:
          postgresql-version: ${{env.PG_VERSION}}

      - name: Install AWS CLI
        run: |
          sudo apt install -y awscli
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: 
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Run Backup and insert into s3 bucket
        run: |
          BACKUP_FILE_NAME="$(date +%Y%m%d | tr -d '-')"
          CLEAN_DB_URL=$(echo ${{ secrets.STAGING_READONLY_STRING }} | sed "s/[?&]pgbouncer=true//")
          pg_dump --dbname="$CLEAN_DB_URL" | aws s3 cp - "s3://${{ env.S3_BUCKET_NAME }}/$BACKUP_FILE_NAME.bak" --region ${{ env.AWS_REGION }}