name: Check Stale Branches

on:
  schedule:
    - cron: "0 19 * * 1" # Monday 5am GMT+10 (19:00 UTC Sunday)

jobs:
  check-stale-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get stale branches
        run: |
          STALE_BRANCHES=$(git branch -r --format='%(refname:short)' --sort=-committerdate | \
            while read branch; do
              if [ "$(git log -1 --since='1 week ago' -s --format='%H' "$branch")" = "" ]; then
                echo "$branch"
              fi
            done)

      - name: Post to Discord if any stale branches are found
        if: success()
        run: |
          if [ -n "$STALE_BRANCHES" ]; then
            curl -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \"The following branches are stale (no commits in the last week):\n$STALE_BRANCHES\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
          else
            echo "No stale branches found."
          fi
