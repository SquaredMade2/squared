name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main
      - develop
      - feature/fix-api-deployment-detection
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api-changed: \${{ steps.check-changes.outputs.api }}
    if: \${{ github.event_name != 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: check-changes
        run: |
          if [[ "\${{ github.ref }}" == "refs/heads/main" ]]; then
            git fetch origin main
            COMPARE_BRANCH="main"
          else
            git fetch origin develop
            COMPARE_BRANCH="develop"
          fi
          PREVIOUS_COMMIT=$(git rev-parse HEAD^)
          echo "api=$(git diff --name-only $PREVIOUS_COMMIT HEAD | grep -q '^apps/api/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy
    needs: [detect-changes]
    runs-on: ubuntu-latest
    if: \${{ needs.detect-changes.outputs.api-changed == 'true' || github.event_name == 'workflow_dispatch' }}
    environment: \${{ github.ref == 'refs/heads/main' && 'API-Production' || 'API-Staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment
        id: set-env
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "environment=API-Production" >> $GITHUB_OUTPUT
            echo "ecr_repository=squared-api-production" >> $GITHUB_OUTPUT
          else
            echo "environment=API-Staging" >> $GITHUB_OUTPUT
            echo "ecr_repository=squared-api-staging" >> $GITHUB_OUTPUT
          fi 

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push API image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -f apps/api/Dockerfile -t api:latest .
          docker tag api:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Substitute environment variables
        env:
          ECS_TASK_DEFINITION: ${{ secrets.ECS_TASK_DEFINITION }}
        run: |
          sed -i 's#PLACEHOLDER_GITHUB_CLIENT_ID#${{ secrets.GH_CLIENT_ID }}#g' $ECS_TASK_DEFINITION
          sed -i 's#PLACEHOLDER_PORT#${{ secrets.PORT }}#g' $ECS_TASK_DEFINITION
          sed -i 's#PLACEHOLDER_JWT_SECRET#${{ secrets.JWT_SECRET }}#g' $ECS_TASK_DEFINITION
          sed -i 's#PLACEHOLDER_GITHUB_CLIENT_SECRET#${{ secrets.GH_CLIENT_SECRET }}#g' $ECS_TASK_DEFINITION
          sed -i 's#PLACEHOLDER_NEXT_PUBLIC_CONFIRM_URL#${{ secrets.NEXT_PUBLIC_CONFIRM_URL }}#g' $ECS_TASK_DEFINITION
          sed -i 's#PLACEHOLDER_POSTGRES_PRISMA_URL#${{ secrets.POSTGRES_PRISMA_URL }}#g' $ECS_TASK_DEFINITION
          sed -i 's#PLACEHOLDER_EMAIL_PASSWORD#${{ secrets.EMAIL_PASSWORD }}#g' $ECS_TASK_DEFINITION
          sed -i 's#PLACEHOLDER_EMAIL_USERNAME#${{ secrets.EMAIL_USERNAME }}#g' $ECS_TASK_DEFINITION
                    
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ secrets.ECS_TASK_DEFINITION }}
          container-name: ${{ secrets.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: false