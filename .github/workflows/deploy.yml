name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main
      - develop
      - deploy-Develop-API
  workflow_dispatch:  # Adds the manual trigger

jobs:
  checks:
    name: Check For Changes
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'API-Production' || 'API-Staging' }}
    outputs:
      changed-app: ${{ steps.changed-app.outputs.result }}
    if: ${{ github.event_name != 'workflow_dispatch' }} 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install turbo
        run: "npm install -g turbo"

      - name: Changeset
        id: changeset
        run: |
          content=$(turbo build --filter=api --dry-run=json)
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$content" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Changed app?
        id: changed-app
        if: ${{ contains(fromJSON(steps.changeset.outputs.result).packages, 'api') }}
        run: echo "result=true" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [checks]
    if: ${{ needs.checks.outputs.changed-app == 'true' || github.event_name == 'workflow_dispatch' }}
    environment: ${{ github.ref == 'refs/heads/main' && 'API-Production' || 'API-Staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment
        id: set-env
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "environment=API-Production" >> $GITHUB_OUTPUT
            echo "ecr_repository=squared-api-production" >> $GITHUB_OUTPUT
          else
            echo "environment=API-Staging" >> $GITHUB_OUTPUT
            echo "ecr_repository=squared-api-staging" >> $GITHUB_OUTPUT
          fi 

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push API image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -f apps/api/Dockerfile -t api:latest .
          docker tag api:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ secrets.ECS_TASK_DEFINITION }}
          container-name: ${{ secrets.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: false