name: "Mark stale issues and PRs"

on:
  schedule:
    - cron: "0 19 * * *" # Runs daily at 5 AM GMT+10
  workflow_dispatch: # Allows manual trigger

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 7
          days-before-pr-stale: 7
          stale-pr-message: "This PR is stale because it has been open for 7 days with no activity."
          stale-pr-label: "Stale"
          days-before-close: 2
          days-before-pr-close: 2
          close-pr-message: "This PR was closed because it has been stalled for 2 days with no activity."

      - name: Send notification to Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PR_NUMBER=$(gh pr list --state=open --json number --jq '.[0].number')
          PR_TITLE=$(gh pr view $PR_NUMBER --json title -q .title)
          PR_URL=$(gh pr view $PR_NUMBER --json url -q .url)
          PR_ASSIGNEE=$(gh pr view $PR_NUMBER --json assignees -q .assignees[0].login)

          # Mapping GitHub usernames to Discord IDs
          MENTION=""
          case "$PR_ASSIGNEE" in
            Chase-T-White) MENTION="<@414567565843759105>" ;;
            edchrepo) MENTION="<@300515474322489344>" ;;
            ellischung) MENTION="<@273201608685387786>" ;;
            klexup) MENTION="<@1220824900365844522>" ;;
            napqueenkaila) MENTION="<@1074750793128882247>" ;;
            NateCummens) MENTION="<@447548944122380309>" ;;
            oerkperl) MENTION="<@1084769574098047059>" ;;
            SerhiiDer) MENTION="<@791023762124308500>" ;;
            Smerly) MENTION="<@277576312686641153>" ;;
            THEjacob1000) MENTION="<@213438742315139073>" ;;
            *) MENTION="Unassigned or no mapping found" ;;
          esac

          curl -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \"The PR titled **$PR_TITLE** (URL: $PR_URL) by @$PR_ASSIGNEE has been marked as stale or closed. $MENTION\"}" \
            "${DISCORD_WEBHOOK_URL}"
