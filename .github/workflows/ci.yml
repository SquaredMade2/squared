name: CI Pipeline

on:
  pull_request:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api-changed: ${{ steps.check-changes.outputs.api }}
      web-changed: ${{ steps.check-changes.outputs.web }}
      www-changed: ${{ steps.check-changes.outputs.www }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changes
        id: check-changes
        run: |
          git fetch origin develop
          echo "api=$(git diff --name-only origin/develop HEAD | grep -q '^apps/api/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "web=$(git diff --name-only origin/develop HEAD | grep -q '^apps/web/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "www=$(git diff --name-only origin/develop HEAD | grep -q '^apps/www/' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
          cache: 'pnpm'

      - run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm check-types

  test-api:
    name: Test API
    needs: detect-changes
    runs-on: ubuntu-latest
    if: ${{ needs.detect-changes.outputs.api-changed == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
          cache: 'pnpm'

      - run: pnpm install

      - name: Run API tests
        run: pnpm test:ci --filter=api

      - name: Build API
        run: pnpm build --filter=api

  test-web:
    name: Test Web
    needs: detect-changes
    runs-on: ubuntu-latest
    if: ${{ needs.detect-changes.outputs.web-changed == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
          cache: 'pnpm'

      - run: pnpm install

      - name: Run Web tests
        run: pnpm test:ci --filter=web

      - name: Build Web
        run: pnpm build --filter=web

  test-www:
    name: Test WWW
    needs: detect-changes
    runs-on: ubuntu-latest
    if: ${{ needs.detect-changes.outputs.www-changed == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
          cache: 'pnpm'

      - run: pnpm install

      - name: Run WWW tests
        run: pnpm test:ci --filter=www

      - name: Build WWW
        run: pnpm build --filter=www

  ci-status:
    name: CI Pipeline
    needs: [lint-and-type-check, test-api, test-web, test-www]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.lint-and-type-check.result }}" == "failure" ]]; then
            echo "Lint and type check failed"
            exit 1
          fi
          if [[ "${{ needs.test-api.result }}" == "failure" || "${{ needs.test-web.result }}" == "failure" || "${{ needs.test-www.result }}" == "failure" ]]; then
            echo "One or more tests failed"
            exit 1
          fi
          echo "All checks passed or were skipped"