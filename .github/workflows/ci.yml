name: CI Pipeline

on:
  pull_request:
  push:
    branches:
      - main

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

  detect-changes:
    name: Detect Changes
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      api-changed: ${{ steps.check-api.outputs.changed }}
      web-changed: ${{ steps.check-web.outputs.changed }}
      www-changed: ${{ steps.check-www.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install turbo
        run: "npm install -g turbo"

      - name: Changeset
        id: changeset
        run: |
          content=`turbo build --dry-run=json`
          content="${content//'%'/'%25'}"
          content="${content//$'\n'/'%0A'}"
          content="${content//$'\r'/'%0D'}"
          # Print encoded content
          echo "Encoded content:"
          echo "$content"
          echo "::set-output name=result::$content"

      - name: Check API changes
        id: check-api
        if: ${{ contains(fromJSON(steps.changeset.outputs.result).packages, 'api') }}
        run: |
          echo "::set-output name=result::true"

      - name: Check API changes
        id: check-web
        if: ${{ contains(fromJSON(steps.changeset.outputs.result).packages, 'api') }}
        run: |
          echo "::set-output name=result::true"

      - name: Check API changes
        id: check-www
        if: ${{ contains(fromJSON(steps.changeset.outputs.result).packages, 'api') }}
        run: |
          echo "::set-output name=result::true"

  lint-and-type-check:
    name: Lint and Type Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0
          
      - uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
          cache: 'pnpm'

      - run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm check-types

  test-api:
    name: Test API
    needs: [setup, detect-changes]
    runs-on: ubuntu-latest
    if: ${{ needs.detect-changes.outputs.api-changed == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
          cache: 'pnpm'

      - run: pnpm install
      
      - name: Run API tests
        run: pnpm test:ci --filter=api

      - name: Build API
        run: pnpm build --filter=api

  test-web:
    name: Test Web
    needs: [setup, detect-changes]
    runs-on: ubuntu-latest
    if: ${{ needs.detect-changes.outputs.web-changed == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0
          
      - uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
          cache: 'pnpm'

      - run: pnpm install

      - name: Run Web tests
        run: pnpm test:ci --filter=web

      - name: Build Web
        run: pnpm build --filter=web

  test-www:
    name: Test WWW
    needs: [setup, detect-changes]
    runs-on: ubuntu-latest
    if: ${{ needs.detect-changes.outputs.www-changed == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.6.0
          cache: 'pnpm'

      - run: pnpm install

      - name: Run WWW tests
        run: pnpm test:ci --filter=www

      - name: Build WWW
        run: pnpm build --filter=www

  ci-status:
    name: CI Pipeline
    needs: [lint-and-type-check, test-api, test-web, test-www]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.lint-and-type-check.result }}" == "failure" ]]; then
            echo "Lint and type check failed"
            exit 1
          fi
          if [[ "${{ needs.test-api.result }}" == "failure" || "${{ needs.test-web.result }}" == "failure" || "${{ needs.test-www.result }}" == "failure" ]]; then
            echo "One or more tests failed"
            exit 1
          fi
          echo "All checks passed or were skipped"