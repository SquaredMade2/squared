name: CI Pipeline

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      # Generate cache key for build outputs
      - name: Generate cache key
        id: cache-key
        run: |
          echo "key=${{ runner.os }}-turbo-${{ github.sha }}-${{ hashFiles('**/bun.lock', '**/turbo.json') }}" >> $GITHUB_OUTPUT

      # Cache Bun dependencies
      - uses: useblacksmith/cache@v5
        name: Setup Bun cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: useblacksmith/cache@v5
        name: Setup Turbo cache
        with:
          path: .turbo
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  build:
    name: Build
    needs: [setup]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      # Cache Bun dependencies
      - uses: useblacksmith/cache@v5
        name: Setup Bun cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: useblacksmith/cache@v5
        name: Setup Turbo cache
        with:
          path: .turbo
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: bun install --frozen-lockfile

      - name: Build packages and applications
        run: bun run build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      # Cache build artifacts
      - uses: useblacksmith/cache@v5
        name: Cache build artifacts
        with:
          path: |
            packages/*/dist
          key: build-artifacts-${{ github.sha }}
          restore-keys: |
            build-artifacts-

  test-and-validate:
    name: Test and Validate
    needs: [build, setup]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        task: [lint, test-ci, tsc]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      # Cache Bun dependencies
      - uses: useblacksmith/cache@v5
        name: Setup Bun cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: useblacksmith/cache@v5
        name: Setup Turbo cache
        with:
          path: .turbo
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Restore build artifacts
      - uses: useblacksmith/cache@v5
        name: Restore build artifacts
        with:
          path: |
            packages/*/dist
          key: build-artifacts-${{ github.sha }}
          restore-keys: |
            build-artifacts-

      - run: bun install --frozen-lockfile

      # Setup Docker Compose for API tests
      - uses: KengoTODA/actions-setup-docker-compose@v1
        if: matrix.task == 'test'
        with:
          version: '2.29.7'

      # Initialize Database for API tests
      - name: Initialize Database Server
        if: matrix.task == 'test'
        run: bun run docker:db:init
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/squared-test
          REMOTE_DATABASE_URL: ${{ secrets.REMOTE_DATABASE_URL }}
          LOCAL_DB: true

      - name: Run ${{ matrix.task }}
        run: bun run ${{ matrix.task }}
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/squared-test
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          CLERK_SECRET: ${{ secrets.CLERK_SECRET_KEY }}
          POSTGRES_PORT: 5434
          NODE_ENV: test
          LOCAL_DB: true
          RUNNING_TESTS: true

      # Stop Database Server
      - name: Stop Database Server
        if: always() && matrix.task == 'test'
        run: bun run docker:db:down

  test-webhooks:
    name: Test Webhooks (Go)
    needs: [setup]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: useblacksmith/setup-go@v6
        with:
          go-version: "1.23"

      - name: Get dependencies
        working-directory: apps/webhooks
        run: go mod download

      - name: Run tests
        working-directory: apps/webhooks
        env:
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_BOT_ID: ${{ secrets.GH_BOT_ID }}
          GITHUB_APP_PRIVATE_KEY_BASE64: ${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
          SERVER_URL: http://localhost:5173
          BASE_URL: http://localhost:8081
          PORT: 3131
          WEBHOOK_SECRET: squared
          APP_URL: https://app.squaredmade.com
          PAPERTRAIL_URL: logs.papertrailapp.com:35736
        run: go test -v ./...

  ci-status:
    name: CI Pipeline
    needs: [build, test-and-validate, test-webhooks]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "Build failed"
            exit 1
          fi
          if [[ "${{ needs.test-and-validate.result }}" == "failure" ]]; then
            echo "Test and validation tasks failed"
            exit 1
          fi
          if [[ "${{ needs.test-webhooks.result }}" == "failure" ]]; then
            echo "Webhook tests failed"
            exit 1
          fi
          echo "All checks passed or were skipped"