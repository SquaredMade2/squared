name: CI Pipeline

on:
  pull_request:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm and setup Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # - name: Install pnpm
      #   uses: pnpm/action-setup@v4
      #   with:
      #     version: 9

      - name: Install dependencies
        run: pnpm install

  lint:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm and setup Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # - name: Install pnpm
      #   uses: pnpm/action-setup@v4
      #   with:
      #     version: 9

      - name: Run linting check
        run: pnpm lint

  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm and setup Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # - name: Install pnpm
      #   uses: pnpm/action-setup@v4
      #   with:
      #     version: 9

      - name: Install Cypress
        run: npx cypress install

      - name: Run tests
        run: pnpm test:ci
