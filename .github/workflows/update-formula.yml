name: Update Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version number (e.g., v0.1.1)'
        required: true

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update formula
        run: |
          VERSION=${{ github.event.inputs.version }}
          URL="https://github.com/SquaredMade2/squared/archive/refs/tags/${VERSION}.tar.gz"
          SHA256=$(curl -L $URL | shasum -a 256 | cut -d ' ' -f 1)
          sed -i "s|url.*|url \"$URL\"|" squared.rb
          sed -i "s|sha256.*|sha256 \"$SHA256\"|" squared.rb
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -am "Update formula to version ${{ github.event.inputs.version }}"
          git push