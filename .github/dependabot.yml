version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "daily"
    groups:
      lexical-packages:
        patterns:
          - "lexical*"
          - "@lexical/*"
      sentry-packages:
        patterns:
          - "@sentry/*"
      ui-packages:
        patterns:
          - "@mui/*"
          - "@fortawesome/*"
          - "@headlessui/*"
          - "@heroicons/*"
      react-packages:
        patterns:
          - "react*"
          - "react-*"
          - "@react*"
          - "@react-*"
      storybook-packages:
        patterns:
          - "@storybook/*"
          - "@babel/*"
          - "@chromatic-com/*"
      types-packages:
        patterns:
          - "@types/*"
          - "types/*"
      testing-packages:
        patterns:
          - "@testing-library/*"
          - "jest*"
          - "jest-*"
          - "@cypress/*"
          - "cypress*"

  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "daily"
    groups:
      sentry-packages:
        patterns:
          - "@sentry/*"

  - package-ecosystem: "npm"
    directories:
      - "/packages/db"
      - "/packages/jest-presets"
      - "/packages/logger"
      - "/packages/test-db"
      - "/packages/ui"
    schedule:
      interval: "daily"
    groups:
      storybook-packages:
        patterns:
          - "@storybook/*"
          - "@babel/*"
      react-packages:
        patterns:
          - "react*"
          - "react-*"
          - "@react*"
          - "@react-*"
      types-packages:
        patterns:
          - "@types/*"
          - "types/*"
      testing-packages:
        patterns:
          - "@testing-library/*"
          - "jest*"
          - "jest-*"
          - "@cypress/*"
          - "cypress*"
