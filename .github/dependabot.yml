version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      storybook-packages:
        patterns:
          - "@storybook/*"
          - "@babel/*"
          - "@chromatic-com/*"
      react-packages:
        patterns:
          - "react*"
          - "react-*"
          - "@react*"
          - "@react-*"
      types-packages:
        patterns:
          - "@types/*"
          - "types/*"
      testing-packages:
        patterns:
          - "@testing-library/*"
          - "jest*"
          - "jest-*"
          - "@cypress/*"
          - "cypress*"
      sentry-packages:
        patterns:
          - "@sentry/*"
      lexical-packages:
        patterns:
          - "lexical*"
          - "@lexical/*"
      ui-packages:
        patterns:
          - "@mui/*"
          - "@fortawesome/*"
          - "@headlessui/*"
          - "@heroicons/*"
      react-packages:
        patterns:
          - "react*"
          - "react-*"
          - "@react*"
          - "@react-*"
