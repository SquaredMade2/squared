version: "3"

services:
  www:
    container_name: www
    build:
      context: .
      dockerfile: ./apps/www/Dockerfile
    restart: always
    ports:
      - 4000:3000
    networks:
      - app_network
    env_file:
      - .env

  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    ports:
      - 3000:3000
    networks:
      - app_network
    env_file:
      - .env

  api:
    container_name: api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: always
    ports:
      - 3001:3001
    networks:
      - app_network
    env_file:
      - .env

  nginx:
    container_name: nginx
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - 80:80
    networks:
      - app_network
    env_file:
      - .env

networks:
  app_network:
    external: true
